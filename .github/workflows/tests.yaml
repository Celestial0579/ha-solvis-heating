name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run the tests
        run: pytest tests
  pytest-minimum:
    name: pytest (minimum Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yaml
      # The minimum from hacs.json. Pinned here and not in requirements_test.txt, so Dependabot does
      # not raise it together with the main pin; raise it together with hacs.json. Home Assistant
      # before 2026.1 does not pin pycares, and its aiodns 3.5 fails with pycares 5.
      - name: Install the minimum Home Assistant
        run: pip install pytest-homeassistant-custom-component==0.13.269 "pycares<5"
      - name: Check it against hacs.json
        run: python -c 'import json, homeassistant.const as c; m = json.load(open("hacs.json"))["homeassistant"]; assert c.__version__ == m, (c.__version__, m)'
      - name: Run the tests
        run: pytest tests
